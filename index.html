<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#170d25"><meta name="apple-mobile-web-app-capable" content="yes"><title>Perfect Love Match AI</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#100b1b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#60265c 0,#21102d 45%,#100b1b 100%)}main{max-width:520px;margin:auto;padding:42px 20px 40px;text-align:center}h1{font-size:clamp(30px,8vw,42px);margin:8px 0}h1 span{color:#ff83b2}.sub{color:#dac5db;line-height:1.5}.heart{font-size:46px;filter:drop-shadow(0 0 18px #ff579c)}.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:30px 0 22px}.upload{aspect-ratio:3/4;border:2px dashed #a26b9d;border-radius:24px;background:#ffffff13;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative}.upload img{width:100%;height:100%;object-fit:cover;display:none}.upload .placeholder{padding:12px;color:#eed7e8}.upload b{display:block;font-size:38px;margin-bottom:10px}.upload input{position:absolute;opacity:0;width:1px;height:1px}.plus{position:absolute;bottom:12px;right:12px;background:#ff5a98;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:22px}button{border:0;border-radius:18px;padding:17px 20px;font-size:17px;font-weight:800;color:white;background:linear-gradient(110deg,#ff428c,#a849ec);box-shadow:0 10px 30px #ef3d8760;width:100%;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.result{display:none;margin-top:25px;padding:24px 18px;border:1px solid #ffffff30;background:#ffffff12;border-radius:25px}.score{font-size:76px;font-weight:900;color:#ff9ac6}.bar{height:14px;border-radius:20px;background:#ffffff25;overflow:hidden}.fill{width:0;height:100%;background:linear-gradient(90deg,#ff4d9b,#ffc4d9);transition:width 1.6s ease}.message{font-size:21px;font-weight:700;line-height:1.45}.small{color:#c9b5cf;font-size:12px;line-height:1.5;margin-top:24px}.secondary{margin-top:15px;background:#ffffff22;box-shadow:none}footer{font-size:12px;color:#bda5c4;margin-top:28px}
</style></head><body><main><div class="heart">💞</div><h1>Perfect <span>Love Match</span></h1><p class="sub">Zwei Fotos. Ein Match. Jede Menge Herzklopfen! ✨</p><div class="photos"><label class="upload"><input type="file" accept="image/*" id="a"><img id="ia" alt="Person 1"><div class="placeholder" id="pa"><b>📸</b>Foto 1 auswählen</div><div class="plus">+</div></label><label class="upload"><input type="file" accept="image/*" id="b"><img id="ib" alt="Person 2"><div class="placeholder" id="pb"><b>📸</b>Foto 2 auswählen</div><div class="plus">+</div></label></div><button id="go" disabled>💘 Love Match berechnen</button><section class="result" id="result" aria-live="polite"><div class="score" id="score">0%</div><div class="bar"><div class="fill" id="fill"></div></div><p class="message" id="msg"></p><p id="extra"></p><button class="secondary" id="share">💌 Ergebnis teilen</button><button class="secondary" id="again">🔄 Nochmal testen</button></section><p class="small">Nur zum Spaß! Der Prozentwert wird zufällig erzeugt, nicht aus Gesichtern oder Persönlichkeitsmerkmalen berechnet. Deine Fotos werden nicht hochgeladen oder gespeichert.</p><footer>designed & developed by Andreas Binder · v1.0.0</footer></main><script>
const files=[null,null],urls=[null,null];['a','b'].forEach((id,i)=>{document.getElementById(id).addEventListener('change',e=>{const f=e.target.files?.[0];if(!f||!f.type.startsWith('image/'))return;if(urls[i])URL.revokeObjectURL(urls[i]);urls[i]=URL.createObjectURL(f);files[i]=f;const img=document.getElementById('i'+id);img.src=urls[i];img.style.display='block';document.getElementById('p'+id).style.display='none';document.getElementById('go').disabled=!files.every(Boolean);document.getElementById('result').style.display='none'})});
const lines=[['Da knistert es gewaltig! 🔥','Amor hat heute Überstunden!'],['Ein Herz und eine Seele! 💕','Da könnte etwas Großes entstehen.'],['Gegensätze ziehen sich an! ⚡','Langweilig wird es garantiert nicht.'],['Chaos trifft Charme! 😄','Eine romantische Komödie wartet auf euch.'],['Die Chemie macht Urlaub! 🏖️','Vielleicht klappt es mit gemeinsamem Pizzaessen.']];
let current='';document.getElementById('go').onclick=()=>{const score=crypto.getRandomValues(new Uint32Array(1))[0]%101;const pair=score>=85?lines[0]:score>=65?lines[1]:score>=40?lines[2]:score>=20?lines[3]:lines[4];document.getElementById('result').style.display='block';document.getElementById('score').textContent='0%';document.getElementById('fill').style.width='0%';document.getElementById('msg').textContent=pair[0];document.getElementById('extra').textContent=pair[1];current='Unser Perfect Love Match: '+score+'% 💞 '+pair[0]+' '+pair[1]+' (Nur zum Spaß!)';requestAnimationFrame(()=>setTimeout(()=>{document.getElementById('score').textContent=score+'%';document.getElementById('fill').style.width=score+'%'},60));document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'})};document.getElementById('again').onclick=()=>document.getElementById('go').click();document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Perfect Love Match',text:current})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(current);alert('Ergebnis kopiert!')}else alert(current)};
</script></body></html>
